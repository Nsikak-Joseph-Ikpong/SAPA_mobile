# Publishes the web tool (web/) to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy web tool to GitHub Pages

on:
  push:
    branches: [main, claude/vibrant-ritchie-p1ubko]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # web/index.html is written without a document skeleton (the Claude artifact adds one): add it here
      - name: Build site
        run: |
          mkdir -p _site
          cp web/*.js _site/
          cp -r web/vendor _site/
          { printf '%s\n' '<!doctype html>' '<html lang="en"><head><meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1">'; cat web/index.html; } > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
